name: Source regression checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: source-regressions-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate tracked Python sources
        run: python3 -m compileall -q scripts tests tools
      - name: Install optional synthetic image-test tools
        run: python3 -m pip install --disable-pip-version-check -r tools/analysis-requirements.txt
      - name: Test import, path and translation safety
        env:
          PYTHONPATH: scripts
        run: python3 -m unittest discover -s tests -v
      - name: Test frame comparison using synthetic reference/candidate images
        run: python3 -m pytest -q tests/test_compare_frames.py
      - name: Verify real-frame hash semantics and flip statistics
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc/gpu tests/frame_stats_test.c src/gpu/nv2a_frame_stats.c -o /tmp/bf-frame-stats
          /tmp/bf-frame-stats
      - name: Validate DX11/DX12-neutral render dimensions and letterboxing
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc tests/render_scale_policy_test.c -lm -o /tmp/bf-render-scale
          /tmp/bf-render-scale
      - name: Validate GPU completion invariants without graphics hardware
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -Isrc tests/gpu_completion_timeline_test.cpp -o /tmp/bf-gpu-timeline
          /tmp/bf-gpu-timeline
      - name: Build and test CPU texture-math regression (C11)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc tests/texture_math_test.c -o /tmp/bf-texture-math
          /tmp/bf-texture-math
      - name: Check texture math with undefined-behavior sanitizer
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all -Isrc tests/texture_math_test.c -o /tmp/bf-texture-math-ubsan
          /tmp/bf-texture-math-ubsan

  pinned-runtime-smoke:
    runs-on: windows-2022
    strategy:
      matrix:
        scene: ["OFF", "ON"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact pinned public xboxrecomp runtime
        shell: pwsh
        run: |
          git clone --quiet https://github.com/sp00nznet/xboxrecomp.git "${{ runner.temp }}/xboxrecomp"
          git -C "${{ runner.temp }}/xboxrecomp" checkout --quiet --detach f0f8a461496a4f23d9b0aeaa284b8d70ba7ab82b
      - name: Configure private build-copy runtime patches
        shell: pwsh
        run: |
          cmake -S . -B "${{ runner.temp }}/bf-smoke" -G "Visual Studio 17 2022" -A x64 "-DXBOXRECOMP_DIR=${{ runner.temp }}/xboxrecomp" -DBF_RUNTIME_CHECKS_ONLY=ON -DBF_EXPERIMENTAL_NV2A_D3D11=${{ matrix.scene }}
      - name: Build patched kernel, NV2A shaders, mono-HRTF audio and DirectX probes
        shell: pwsh
        run: cmake --build "${{ runner.temp }}/bf-smoke" --config Release --parallel 4 --target xbox_kernel xbox_video xbox_apu bf_nv2a_hlsl_test bf_apu_hrtf_test bf_pscache_test bf_render_scale_test bf_frame_stats_test bf_nv2a_p8_test bf_gpu_timeline_test bf_d3d12_compat_test bf_d3d12_texture_test
      - name: Test NV2A GPU shader code, HRTF mixing and DX12 WARP compatibility
        shell: pwsh
        run: ctest --test-dir "${{ runner.temp }}/bf-smoke" -C Release -R "^(gpu_timeline|d3d12_compat|d3d12_texture|nv2a_hlsl|apu_mono_hrtf|shader_cache|render_scale|frame_stats|nv2a_p8_decode)$" --output-on-failure -V
      - name: Build and compare real NV2A draws with the CPU reference on WARP
        if: matrix.scene == 'ON'
        shell: pwsh
        run: |
          cmake --build "${{ runner.temp }}/bf-smoke" --config Release --parallel 4 --target bf_gpu_scene_test
          ctest --test-dir "${{ runner.temp }}/bf-smoke" -C Release -R "^nv2a_gpu_scene_parity$" --output-on-failure -V

  native-launcher:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure the native application without game files
        run: cmake -S . -B build/launcher -DBF_LAUNCHER_ONLY=ON
      - name: Build the native executable and its pinned dependencies
        run: cmake --build build/launcher --config Release --parallel 4
      - name: Verify launch settings and window lifecycle across normal and failed child exits
        run: ctest --test-dir build/launcher -C Release --output-on-failure
