name: Source regression checks

on:
  pull_request:
  push:
    branches:
      - integration/tzeentchnet-texture-math

jobs:
  source-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate tracked Python sources
        run: python3 -m compileall -q launcher scripts tests
      - name: Test import, path and translation safety
        run: python3 -m unittest discover -s tests -v
      - name: Test frame comparison using synthetic reference/candidate images
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/analysis-requirements.txt
          python3 -m pytest -q tests/test_compare_frames.py
      - name: Build and test CPU texture-math regression (C11)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc tests/texture_math_test.c -o /tmp/bf-texture-math
          /tmp/bf-texture-math
      - name: Check texture math with undefined-behavior sanitizer
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all -Isrc tests/texture_math_test.c -o /tmp/bf-texture-math-ubsan
          /tmp/bf-texture-math-ubsan

  pinned-runtime-smoke:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact pinned public xboxrecomp runtime
        shell: pwsh
        run: |
          git clone --quiet https://github.com/sp00nznet/xboxrecomp.git "${{ runner.temp }}/xboxrecomp"
          git -C "${{ runner.temp }}/xboxrecomp" checkout --quiet --detach f0f8a461496a4f23d9b0aeaa284b8d70ba7ab82b
      - name: Create synthetic configuration inputs (no game code)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ runner.temp }}/bf-generated", "${{ runner.temp }}/bf-recovered" | Out-Null
          Set-Content -Path "${{ runner.temp }}/bf-generated/recomp_dispatch.c" -Value '/* synthetic compile fixture */'
          Set-Content -Path "${{ runner.temp }}/bf-generated/native-media-profile.json" -Value '{}'
          Set-Content -Path "${{ runner.temp }}/bf-recovered/recomp_recovered.c" -Value '/* synthetic compile fixture */'
      - name: Configure private build-copy runtime patches
        shell: pwsh
        run: |
          cmake -S . -B "${{ runner.temp }}/bf-smoke" -G "Visual Studio 17 2022" -A x64 "-DXBOXRECOMP_DIR=${{ runner.temp }}/xboxrecomp" "-DBF_GENERATED_DIR=${{ runner.temp }}/bf-generated" "-DBF_RECOVERED_DIR=${{ runner.temp }}/bf-recovered"
      - name: Build patched kernel and Windows framebuffer presenter
        shell: pwsh
        run: cmake --build "${{ runner.temp }}/bf-smoke" --config Release --parallel 4 --target xbox_kernel xbox_video
